<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kiểm tra năm nhuận</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }
        input, button {
            padding: 8px 12px;
            font-size: 16px;
        }
        #ketqua {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Chương trình kiểm tra năm nhuận</h2>
    
    <label for="namInput">Nhập năm cần kiểm tra: </label>
    <input type="number" id="namInput" placeholder="Ví dụ: 2024" value="2024">
    <button onclick="kiemTraNamNhuan()">Kiểm tra</button>
    <p id="ketqua"></p>

    <script>
        function kiemTraNamNhuan() {
            let nam = parseInt(document.getElementById("namInput").value);
            if (isNaN(nam)) {
                document.getElementById("ketqua").innerHTML = "Vui lòng nhập một số năm hợp lệ!";
                document.getElementById("ketqua").style.color = "red";
                return;
            }

            let thongBao = "";

            if ((nam % 4 === 0 && nam % 100 !== 0) || (nam % 400 === 0)) {
                thongBao = `Năm ${nam} LÀ năm nhuận.`;
                document.getElementById("ketqua").style.color = "green";
            } else {
                thongBao = `Năm ${nam} KHÔNG PHẢI là năm nhuận.`;
                document.getElementById("ketqua").style.color = "red";
            }

            document.getElementById("ketqua").innerHTML = thongBao;

            console.log(thongBao);
        }
        kiemTraNamNhuan();
    </script>

</body>
</html>
