<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Baif 5:Kiểm tra số nguyên tố</title>
</head>
<body>

    <script>
        let input = prompt("Vui lòng nhập vào một số nguyên dương:");
        let n = Number(input);
        if (input === null || input.trim() === "" || isNaN(n) || !Number.isInteger(n) || n <= 0) {
            alert("Dữ liệu không hợp lệ! Vui lòng nhập một số nguyên dương.");
        } else {
            let isPrime = true;

            if (n < 2) {
                isPrime = false; 
            } else {
                for (let i = 2; i <= Math.sqrt(n); i++) {
                    if (n % i === 0) {
                        isPrime = false;
                        break; 
                    }
                }
            }
            if (isPrime) {
                alert(`${n} LÀ số nguyên tố.`);
            } else {
                alert(`${n} KHÔNG PHẢI là số nguyên tố.`);
            }
        }
    </script>

</body>
</html>
