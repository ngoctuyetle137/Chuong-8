<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bai 9:Viết hoa chữ cái đầu tiên mỗi từ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            line-height: 1.6;
        }
        input {
            width: 320px;
            padding: 8px 12px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
        .result-box {
            margin-top: 20px;
            font-size: 18px;
        }
        .highlight {
            color: #007bff;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Chương trình viết hoa chữ cái đầu của mỗi từ</h2>

    <label for="strInput">Nhập chuỗi văn bản: </label><br><br>
    <input type="text" id="strInput" value="need not to know">
    <button onclick="xuLyChuoi()">Chuyển đổi</button>
    <div class="result-box">
        Kết quả: <span id="ketqua" class="highlight"></span>
    </div>

    <script>
        function capitalizeWords(str) {
            let words = str.split(" ");

            let capitalizedWords = words.map(function(word) {
                if (word.length === 0) return "";

                return word.charAt(0).toUpperCase() + word.slice(1);
            });
            return capitalizedWords.join(" ");
        }

        function xuLyChuoi() {
            let inputStr = document.getElementById("strInput").value;
            let outputStr = capitalizeWords(inputStr);

            document.getElementById("ketqua").textContent = outputStr;

            console.log("Chuỗi ban đầu:", inputStr);
            console.log("Kết quả sau chuyển đổi:", outputStr);
        }

        xuLyChuoi();
    </script>

</body>
</html>
